name: "1. Smart Diff Sync & Progressive Override (YTray)"

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:
    inputs:
      force_release:
        description: '၁၀၀% မပြီးသေးလည်း YTray Release အတင်းထုတ်မည်လား? (true/false)'
        required: false
        default: 'false'

permissions:
  contents: write
  actions: write

env:
  UPSTREAM_REPO: "[https://github.com/yaklang/ytray.git](https://github.com/yaklang/ytray.git)"
  UPSTREAM_BRANCH: "main"
  TARGET_BRANCH: "english-edition"
  YAKLANG_FORK_REPO: "[https://github.com/professoxrmoriarty/yaklang.git](https://github.com/professoxrmoriarty/yaklang.git)"

jobs:
  sync-and-translate:
    name: "Sync & Progressive Override YTray"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: "2. Sync Upstream Diffs"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/backup/workflows
          cp -r .github/workflows/* /tmp/backup/workflows/ 2>/dev/null || true
          [ -f ".i18n_cache.json" ] && cp .i18n_cache.json /tmp/backup/

          git remote add upstream "${{ env.UPSTREAM_REPO }}" 2>/dev/null || git remote set-url upstream "${{ env.UPSTREAM_REPO }}"
          git fetch upstream "${{ env.UPSTREAM_BRANCH }}" --tags
          UP_REF="upstream/${{ env.UPSTREAM_BRANCH }}"
          git checkout -B "${{ env.TARGET_BRANCH }}" "origin/${{ env.TARGET_BRANCH }}" 2>/dev/null || git checkout -B "${{ env.TARGET_BRANCH }}" "$UP_REF"

          if ! git merge "$UP_REF" -X theirs --allow-unrelated-histories --no-edit; then
            git status --porcelain | awk '$1=="DU" || $1=="UD" {print $2}' | xargs -r git rm -f
            git checkout --theirs . || true
            git add -A; git commit --no-edit || true
          fi

          rm -rf .github/workflows/*; mkdir -p .github/workflows
          cp -r /tmp/backup/workflows/* .github/workflows/ 2>/dev/null || true
          [ -f "/tmp/backup/.i18n_cache.json" ] && cp /tmp/backup/.i18n_cache.json .

          git clone --depth 1 --branch english-edition "${{ env.YAKLANG_FORK_REPO }}" /tmp/yaklang_fork 2>/dev/null || true
          [ -f "/tmp/yaklang_fork/.i18n_cache.json" ] && cp "/tmp/yaklang_fork/.i18n_cache.json" /tmp/yaklang_cache.json
          rm -rf /tmp/yaklang_fork

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install -g typescript

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python3 -m pip install --upgrade pip deep-translator PyYAML

      - name: "3. Progressive Override (C#, XAML, Swift, TS, JSON)"
        id: translate
        run: |
          python3 - << 'EOF'
          import os, re, json, time
          import xml.etree.ElementTree as ET
          from deep_translator import GoogleTranslator

          CACHE_FILE = ".i18n_cache.json"
          translator = GoogleTranslator(source='zh-CN', target='en')
          zh_char_re = re.compile(r'[\u4e00-\u9fff]')
          def has_zh(text): return bool(zh_char_re.search(str(text)))

          cache = {}
          for cf in ("/tmp/yaklang_cache.json", CACHE_FILE):
              if os.path.exists(cf):
                  try:
                      with open(cf, 'r', encoding='utf-8') as f: cache.update(json.loads(f.read()))
                  except: pass

          TOKEN_RE = re.compile(
              r'(//[^\n]*|/\*[\s\S]*?\*/|<!--[\s\S]*?-->)'
              r'|(\$"[^"\n]*"|@"[^"]*"|"""[\s\S]*?""")'
              r'|("(?:\\.|[^"\\\n])*")'
              r'|(>[^<>{}`"\']*?[\u4e00-\u9fff]+[^<>{}`"\']*?<)'
          )

          source_files = []
          zh_strings = set()
          IGNORE_DIRS = {".git", "node_modules", "build", "dist", "bin", "obj", "Tests", "assets"}
          IGNORE_STRINGS = {"微软雅黑", "宋体", "黑体", "苹方", "楷体", "Microsoft YaHei", "PingFang SC"}

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in IGNORE_DIRS and not d.endswith('Tests')]
              for file in files:
                  if "Test" in file or "test" in file: continue
                  if file.endswith(('.cs', '.xaml', '.swift', '.ts', '.tsx', '.json')):
                      p = os.path.join(root, file)
                      try:
                          with open(p, 'r', encoding='utf-8') as f: c = f.read()
                          if not has_zh(c): continue
                          source_files.append((p, c))
                          is_xml = file.endswith('.xaml')
                          for m in TOKEN_RE.finditer(c):
                              comment, special, dq, xml_s = m.groups()
                              if comment or special: continue
                              if dq and has_zh(dq):
                                  inner = dq[1:-1]
                                  if inner.strip() not in IGNORE_STRINGS and len(inner) <= 400: zh_strings.add(inner)
                              elif is_xml and xml_s and has_zh(xml_s):
                                  inner = xml_s[1:-1].strip()
                                  if inner and inner not in IGNORE_STRINGS and len(inner) <= 400: zh_strings.add(inner)
                      except: pass

          uncached = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          
          start_time = time.time()
          limit_reached = False
          for idx, s in enumerate(uncached):
              if time.time() - start_time > 45 * 60: limit_reached = True; break
              try:
                  res = translator.translate(s)
                  if res and not has_zh(res): cache[s] = res
              except: time.sleep(1.5)
              if (idx + 1) % 30 == 0: 
                  with open(CACHE_FILE, 'w', encoding='utf-8') as f: json.dump(cache, f, ensure_ascii=False, indent=2)
                  time.sleep(0.4)

          with open(CACHE_FILE, 'w', encoding='utf-8') as f: json.dump(cache, f, ensure_ascii=False, indent=2)

          # ACTIVE OVERRIDE: Replace in source files immediately
          for p, c in source_files:
              try:
                  is_xml = p.endswith('.xaml')
                  def repl(m):
                      comment, special, dq, xml_s = m.groups()
                      if comment or special: return m.group(0)
                      if dq and has_zh(dq):
                          inner = dq[1:-1]
                          if inner.strip() in IGNORE_STRINGS or inner not in cache or has_zh(cache[inner]): return dq
                          tr = cache[inner].replace('\r', ' ').replace('\n', '\\n')
                          tr = re.sub(r'(?<!\\)"', r'\"', tr)
                          if is_xml: tr = tr.replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;').replace('\\"', '&quot;')
                          return f'"{tr}"'
                      if is_xml and xml_s and has_zh(xml_s):
                          raw_inner = xml_s[1:-1]
                          stripped = raw_inner.strip()
                          if stripped in cache and not has_zh(cache[stripped]):
                              tr = cache[stripped].replace('&', '&amp;').replace('<', '&lt;').replace('>', '&gt;')
                              lead = raw_inner[:len(raw_inner) - len(raw_inner.lstrip())]
                              trail = raw_inner[len(raw_inner.rstrip()):]
                              return f">{lead}{tr}{trail}<"
                      return m.group(0)
                  
                  nc = TOKEN_RE.sub(repl, c)
                  if nc != c:
                      valid = True
                      if p.endswith('.json'):
                          try: json.loads(nc)
                          except: valid = False
                      elif p.endswith('.xaml'):
                          try: ET.fromstring(nc)
                          except: valid = False
                      if valid:
                          with open(p, 'w', encoding='utf-8') as f: f.write(nc)
              except: pass

          remaining = [s for s in zh_strings if s not in cache or has_zh(cache.get(s, ""))]
          is_complete = (len(remaining) == 0) and not limit_reached
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write(f"is_complete={'true' if is_complete else 'false'}\n")
              f.write(f"remaining_count={len(remaining)}\n")
          EOF

      - name: "4. TS Syntax Check & Auto-Revert"
        run: |
          node - << 'EOF'
          const fs = require("fs");
          const { execFileSync } = require("child_process");
          let ts;
          try { ts = require("typescript"); } catch(e) { process.exit(0); }
          function walk(dir, list = []) {
            if (!fs.existsSync(dir)) return list;
            for (const entry of fs.readdirSync(dir, { withFileTypes: true })) {
              if (entry.name === "node_modules" || entry.name === "dist") continue;
              const full = dir + "/" + entry.name;
              if (entry.isDirectory()) walk(full, list);
              else if (entry.name.endsWith(".ts") || entry.name.endsWith(".tsx")) list.push(full);
            }
            return list;
          }
          const files = walk(".");
          for (const f of files) {
            try {
              const content = fs.readFileSync(f, "utf8");
              const isTsx = f.endsWith(".tsx");
              const sf = ts.createSourceFile(f, content, 99, true, isTsx ? 4 : 3);
              if (sf.parseDiagnostics && sf.parseDiagnostics.length > 0) execFileSync("git", ["checkout", "HEAD", "--", f]);
            } catch(e) {}
          }
          EOF

      - name: "5. Commit Source Code Progress & Trigger Release"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git add -A
          if ! git diff --cached --quiet; then
            if [ "${{ steps.translate.outputs.is_complete }}" == "true" ]; then
              git commit -m "feat(i18n): 100% translated source files to English"
            else
              git commit -m "chore(i18n): progressive source code override (${{ steps.translate.outputs.remaining_count }} left) [skip ci]"
            fi
            git push origin HEAD:refs/heads/${{ env.TARGET_BRANCH }} --force
          fi

          if [ "${{ steps.translate.outputs.is_complete }}" == "true" ] || [ "${{ inputs.force_release }}" == "true" ]; then
            VERSION="$(tr -d '[:space:]' < VERSION 2>/dev/null || echo '0.2.3')"
            EN_TAG="v${VERSION}-ytray-en"
            git tag -f "${EN_TAG}" HEAD
            git push origin "refs/tags/${EN_TAG}" --force
            gh workflow run 2-build-release.yml --ref "${{ env.TARGET_BRANCH }}" -f tag_name="${EN_TAG}" || true
          fi
