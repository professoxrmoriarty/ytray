name: "2. Build & Release YTray (English Edition)"

on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag အမည် (ဥပမာ v2026.10.30-ytray-en)'
        required: false
        default: ''
      target_ref:
        description: 'Build လုပ်မည့် Branch (ပုံမှန် english-edition)'
        required: false
        default: 'english-edition'
  push:
    tags:
      - 'v*-ytray-en'

permissions:
  contents: write

jobs:
  version:
    name: Resolve release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.ref }}
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "${GITHUB_REF_NAME#v}" = "$version"
          fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]
          python3 script/verify-app-icons.py
          bash script/test-release-index.sh
          test -n "$(bash script/release-notes.sh "$version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          python3 -m unittest discover -s script/tests -v
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  publish:
    name: Publish GitHub Release and OSS
    if: >
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/'))
      || (github.event_name == 'workflow_dispatch' && inputs.tag_name != '')
    needs: [version, prepare]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    concurrency:
      group: ytray-release-publication
      cancel-in-progress: false
    env:
      OSS_BUCKET: yaklang
      OSS_ENDPOINT: oss-accelerate.aliyuncs.com
      PUBLIC_BASE_URL: https://aliyun-oss.yaklang.com/ytray
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.target_ref || github.ref }}

      - uses: actions/download-artifact@v4
        with:
          name: prepared-release
          path: dist

      - name: Create GitHub Release
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: bash script/release-notes.sh "$VERSION" > release-notes.md

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || needs.version.outputs.tag }}
          name: YTray v${{ needs.version.outputs.version }}
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name || needs.version.outputs.tag, '-') }}
          body_path: release-notes.md
          files: dist/*
